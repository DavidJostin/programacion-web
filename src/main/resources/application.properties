spring.application.name=crud
server.port=8081

# In-memory H2 database: no external DB server needed; data is recreated on every start
spring.datasource.url=jdbc:h2:mem:crud_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema generated from the JPA entities at startup and dropped on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
