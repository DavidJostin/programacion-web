spring.application.name=crud

# Puerto de la aplicación (Fuerza 8080 para Docker, o usa la variable de entorno si se define)
server.port=${SERVER_PORT:8080}

# PostgreSQL: Compatible con Docker (usa "db") y Local (usa "localhost")
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crud_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# Secreto que API Gateway envía en el header X-Gateway-Secret (ver GatewaySecretFilter).
# Vacío = filtro apagado (desarrollo local sin Gateway)
gateway.secret=${GATEWAY_SECRET:}